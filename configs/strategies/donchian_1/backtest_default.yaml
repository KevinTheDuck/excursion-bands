data:
  data_config: configs/data/local_nq_5m.yaml
  sessions_config: configs/sessions/nq_default.yaml
  volatility_config: configs/features/volatility/specification.yaml
  bands_config: configs/features/bands/nq_default.yaml
  variants: configs/strategies/donchian_1/variants

backtest:
  start_date: 2019-01-01
  end_date: null
  initial_cash: 100000.0

instrument:
  symbol: NQ
  point_value: 20.0
  tick_size: 0.25
  cfd_point_value: 1.0

execution:
  commission_per_contract_side: 4.5
  slippage_ticks_per_side: 3.0
  fill_on: next_open
  same_bar_exit_priority: stop

sizing:
  mode: risk_current_equity
  fixed_units: 1.0
  risk_pct: 0.01
  max_units: null

risk:
  stop_loss_points: null
  take_profit_points: null

benchmark:
  enabled: true
  strategy: buy_and_hold

strategy:
  name: donchian
  force_exit_time: "16:00"
  donchian:
    lookback_bars: 20
  atr:
    lookback_sessions: 20
    buffer_mult: 0.1
  stop:
    mode: atr
  atr_stop:
    enabled: true
    length: 14
    multiplier: 2.0
  take_profit:
    rr: 3.0
  break_even:
    enabled: false
    trigger_rr: 3.0
    offset_points: 0.0

reports:
  output_dir: data/output/backtests
  save_charts: true
  monte_carlo:
    enabled: true
    simulations: 1000
    sample_trades: 100
    max_paths_plotted: 100
    seed: 42

ml:
  enabled: true
  probability_threshold: 0.35
  min_train_samples: 150
  warmup_start_date: 2014-01-01
  train_lookback_months: 60
  refit_frequency_sessions: 200
  fallback: allow_all
  xgboost:
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

wfo:
  enabled: true
  mode: calendar
  train_months: 6
  test_months: 3
  step_months: 3
  train_sessions: 504
  test_sessions: 63
  step_sessions: 63
  objective: profit_factor
  max_parameter_combinations: 512
  max_workers: 1
  parameter_grid:
    strategy.donchian.lookback_bars: [20, 40]
    strategy.atr_stop.multiplier: [1.0, 2.0, 3.0]
    strategy.take_profit.rr: [2.0, 3.0, 4.0]
    strategy.break_even.enabled: [true, false]
    ml.probability_threshold: [0.35, 0.4, 0.45]
