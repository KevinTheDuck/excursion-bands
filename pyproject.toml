[project]
name = "excursion-bands"
version = "0.1.0"
description = "Excursion bands models"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "backtesting>=0.6.5",
    "databento>=0.77.0",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.136.1",
    "fredapi>=0.5.2",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "pandas-ta>=0.4.71b0",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["excursion_bands*"]
